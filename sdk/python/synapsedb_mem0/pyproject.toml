[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "synapsedb-mem0"
version = "0.1.0"
description = "Drop-in mem0 replacement backed by synapsedb – local, fast, zero cloud"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "msgpack>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["synapsedb_mem0*"]
