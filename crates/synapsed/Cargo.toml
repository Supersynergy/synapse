[package]
name = "synapsed"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "synapsed"
path = "src/main.rs"

[[bin]]
name = "synx-fast"
path = "src/bin/synx_fast.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
rmp-serde.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
synapse-core = { path = "../synapse-core", default-features = false, features = ["backend-rusqlite", "embed", "turbo"] }
synapse-rerank = { path = "../synapse-rerank", features = [] }
ed25519-dalek.workspace = true
axum.workspace = true
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
parking_lot.workspace = true
rusqlite.workspace = true
mimalloc = { version = "0.1", default-features = false }

[features]
default = ["embed-mlx", "ann-usearch", "simsimd", "tantivy-fts"]
embed-mlx = ["synapse-core/embed-mlx"]
ann-usearch = ["synapse-core/ann-usearch"]
simsimd = ["synapse-core/simsimd"]
tantivy-fts = ["synapse-core/tantivy-fts"]
licensed = []
onnx = ["synapse-rerank/onnx"]
