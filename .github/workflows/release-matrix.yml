name: release-matrix

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to build (tag, branch, or SHA)"
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-native:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04
            archive: tar.gz
            cross: true
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            archive: tar.gz
          - target: aarch64-apple-darwin
            runner: macos-14
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            archive: zip
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            archive: zip
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # pinned 2026-06-20
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.target }}

      - name: Install cross toolchain (Linux aarch64)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc' >> "$GITHUB_ENV"

      - name: Build release binaries
        shell: bash
        run: |
          cargo build --release --locked --target ${{ matrix.target }} -p synapse-cli
          cargo build --release --locked --target ${{ matrix.target }} -p synapse-ultra --bin synapse-ultra

      - name: Package (unix)
        if: matrix.archive != 'zip'
        shell: bash
        run: |
          set -e
          STAGE="synapse-${{ matrix.target }}"
          mkdir -p "$STAGE/bin" "$STAGE/docs"
          cp target/${{ matrix.target }}/release/synx "$STAGE/bin/"
          cp target/${{ matrix.target }}/release/synapse-ultra "$STAGE/bin/" || true
          cp README.md SYNAPSE-ULTRA.md LICENSE* "$STAGE/docs/" 2>/dev/null || true
          tar czf "$STAGE.tar.gz" "$STAGE"
          shasum -a 256 "$STAGE.tar.gz" > "$STAGE.tar.gz.sha256"

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $Stage = "synapse-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "$Stage\bin", "$Stage\docs"
          Copy-Item "target\${{ matrix.target }}\release\synx.exe" "$Stage\bin\" -ErrorAction SilentlyContinue
          Copy-Item "target\${{ matrix.target }}\release\synapse-ultra.exe" "$Stage\bin\" -ErrorAction SilentlyContinue
          Copy-Item "README.md", "SYNAPSE-ULTRA.md" "$Stage\docs\" -ErrorAction SilentlyContinue
          Compress-Archive -Path "$Stage" -DestinationPath "$Stage.zip"
          $hash = (Get-FileHash "$Stage.zip" -Algorithm SHA256).Hash
          "$hash  $Stage.zip" | Out-File -Encoding ascii "$Stage.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synapse-${{ matrix.target }}
          path: |
            synapse-${{ matrix.target }}.tar.gz
            synapse-${{ matrix.target }}.tar.gz.sha256
            synapse-${{ matrix.target }}.zip
            synapse-${{ matrix.target }}.zip.sha256
          if-no-files-found: error

  release:
    name: publish release
    needs: build-native
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: synapse-*
          merge-multiple: false

      - name: Flatten artifacts
        shell: bash
        run: |
          mkdir -p release
          find dist -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' \) -exec cp {} release/ \;
          ls -la release/

      - name: Create GitHub release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
