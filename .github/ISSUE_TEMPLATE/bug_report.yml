name: Bug report
description: Something isn't working as documented
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, what did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Synapse version
      placeholder: v1.0.0 / git sha
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: macOS 14 M4 Max / Linux x86_64
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal steps — ideally a shell block we can paste
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
