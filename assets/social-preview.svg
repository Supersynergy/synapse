<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="Synapse — one file. Your AI's entire memory.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1021"/>
      <stop offset="55%" stop-color="#1a0e2e"/>
      <stop offset="100%" stop-color="#3d1715"/>
    </linearGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff7a18"/>
      <stop offset="100%" stop-color="#ff3e3e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7bf0ff"/>
      <stop offset="100%" stop-color="#c37bff"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="160" cy="120" r="130" fill="#ff7a18" opacity="0.2" filter="url(#soft)"/>
  <circle cx="1120" cy="540" r="160" fill="#7bf0ff" opacity="0.14" filter="url(#soft)"/>

  <text x="80" y="220" font-family="SF Pro Display, Inter, system-ui, sans-serif" font-size="140" font-weight="800" fill="#ffffff" letter-spacing="-3">Synapse</text>
  <text x="80" y="290" font-family="SF Pro Display, Inter, system-ui, sans-serif" font-size="46" font-weight="500" fill="#e5e7eb" letter-spacing="-0.8">One file. Your AI's entire memory.</text>
  <text x="80" y="340" font-family="SF Pro Display, Inter, system-ui, sans-serif" font-size="26" font-weight="400" fill="#94a3b8">Rust · MCP-native · MIT · single-file agent memory</text>

  <g transform="translate(80, 410)" font-family="JetBrains Mono, ui-monospace, monospace">
    <text x="0" y="0" font-size="58" font-weight="800" fill="url(#rust)">23 µs</text>
    <text x="0" y="34" font-size="18" fill="#94a3b8" letter-spacing="2">BM25 QUERY</text>
  </g>
  <g transform="translate(320, 410)" font-family="JetBrains Mono, ui-monospace, monospace">
    <text x="0" y="0" font-size="58" font-weight="800" fill="url(#rust)">22 µs</text>
    <text x="0" y="34" font-size="18" fill="#94a3b8" letter-spacing="2">VECTOR kNN</text>
  </g>
  <g transform="translate(560, 410)" font-family="JetBrains Mono, ui-monospace, monospace">
    <text x="0" y="0" font-size="58" font-weight="800" fill="url(#rust)">0.69 ms</text>
    <text x="0" y="34" font-size="18" fill="#94a3b8" letter-spacing="2">COLD OPEN</text>
  </g>
  <g transform="translate(840, 410)" font-family="JetBrains Mono, ui-monospace, monospace">
    <text x="0" y="0" font-size="58" font-weight="800" fill="url(#accent)">1 file</text>
    <text x="0" y="34" font-size="18" fill="#94a3b8" letter-spacing="2">NO SERVERS</text>
  </g>

  <g transform="translate(80, 540)" font-family="JetBrains Mono, ui-monospace, monospace" font-size="22" font-weight="500" fill="#e5e7eb">
    <text x="0" y="0">
      <tspan fill="url(#rust)" font-weight="700">put</tspan>
      <tspan fill="#94a3b8"> → [ </tspan>
      <tspan>BM25</tspan>
      <tspan fill="#94a3b8"> ∥ </tspan>
      <tspan>HNSW+PQ</tspan>
      <tspan fill="#94a3b8"> ∥ </tspan>
      <tspan>KG</tspan>
      <tspan fill="#94a3b8"> ] → </tspan>
      <tspan>fused rank</tspan>
      <tspan fill="#94a3b8"> → </tspan>
      <tspan fill="url(#accent)" font-weight="700">Ed25519-signed</tspan>
      <tspan fill="#94a3b8"> → </tspan>
      <tspan font-weight="700">.synx</tspan>
    </text>
  </g>
</svg>
