<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" role="img" aria-label="Synapse — one file. Your AI's entire memory.">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- monochrome black base -->
  <rect width="1280" height="420" fill="#0a0a0a"/>
  <rect width="1280" height="420" fill="url(#grid)"/>

  <!-- logo mark, top-left -->
  <g transform="translate(80, 70)">
    <circle cx="28" cy="28" r="28" fill="#171717"/>
    <path d="M16 16 A 12 12 0 0 1 28 28" fill="none" stroke="#ff5722" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M40 40 A 12 12 0 0 1 28 28" fill="none" stroke="#ff5722" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="28" cy="28" r="2.5" fill="#fafafa"/>
  </g>

  <!-- wordmark + tagline -->
  <g font-family="Inter, SF Pro Display, system-ui, sans-serif">
    <text x="180" y="102" font-size="88" font-weight="800" fill="#fafafa" letter-spacing="-3">Synapse</text>
    <text x="180" y="148" font-size="26" font-weight="500" fill="#a3a3a3" letter-spacing="-0.4">One file. Your AI's entire memory.</text>
  </g>

  <!-- primary metric — benchmark-as-brand -->
  <g transform="translate(80, 240)" font-family="JetBrains Mono, ui-monospace, monospace">
    <text x="0" y="0" font-size="92" font-weight="800" fill="#ff5722" letter-spacing="-2">22 µs</text>
    <text x="0" y="32" font-size="14" font-weight="500" fill="#737373" letter-spacing="2.5">VECTOR kNN · k=10 · 2k × 64d</text>
  </g>

  <!-- secondary stack, right side -->
  <g transform="translate(600, 212)" font-family="JetBrains Mono, ui-monospace, monospace">
    <text x="0" y="0"   font-size="36" font-weight="700" fill="#fafafa">23 µs <tspan fill="#737373" font-weight="400" font-size="14">BM25 · Tantivy</tspan></text>
    <text x="0" y="46"  font-size="36" font-weight="700" fill="#fafafa">0.69 ms <tspan fill="#737373" font-weight="400" font-size="14">cold open · mmap</tspan></text>
    <text x="0" y="92"  font-size="36" font-weight="700" fill="#fafafa">0.59 ms <tspan fill="#737373" font-weight="400" font-size="14">CRDT merge · Automerge</tspan></text>
    <text x="0" y="138" font-size="36" font-weight="700" fill="#fafafa">25 µs <tspan fill="#737373" font-weight="400" font-size="14">Ed25519 sign + verify</tspan></text>
  </g>

  <!-- footer chip: stack -->
  <g transform="translate(80, 380)" font-family="Inter, SF Pro Display, system-ui, sans-serif" font-size="13" font-weight="500" fill="#737373">
    <text x="0" y="0">Rust · MCP-native · MIT + CC0 · one binary, one file, no servers</text>
  </g>
</svg>
