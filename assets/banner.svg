<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" role="img" aria-label="Synapse — one file. Your AI's entire memory.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1021"/>
      <stop offset="60%" stop-color="#1a0e2e"/>
      <stop offset="100%" stop-color="#3d1715"/>
    </linearGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff7a18"/>
      <stop offset="100%" stop-color="#ff3e3e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7bf0ff"/>
      <stop offset="100%" stop-color="#c37bff"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>

  <!-- soft glow orbs -->
  <circle cx="170" cy="100" r="90" fill="#ff7a18" opacity="0.18" filter="url(#soft)"/>
  <circle cx="1100" cy="330" r="120" fill="#7bf0ff" opacity="0.12" filter="url(#soft)"/>

  <!-- title -->
  <text x="80" y="130" font-family="SF Pro Display, Inter, system-ui, sans-serif" font-size="94" font-weight="800" fill="#ffffff" letter-spacing="-2">
    Synapse
  </text>
  <text x="80" y="180" font-family="SF Pro Display, Inter, system-ui, sans-serif" font-size="34" font-weight="500" fill="#e5e7eb" letter-spacing="-0.5">
    One file. Your AI's entire memory.
  </text>

  <!-- pipeline chip -->
  <g transform="translate(80, 220)">
    <rect width="1120" height="54" rx="27" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="28" y="35" font-family="JetBrains Mono, ui-monospace, monospace" font-size="20" font-weight="500" fill="#e5e7eb">
      <tspan fill="url(#rust)" font-weight="700">put</tspan>
      <tspan fill="#94a3b8"> → [ </tspan>
      <tspan fill="#ffffff">BM25</tspan>
      <tspan fill="#94a3b8"> ∥ </tspan>
      <tspan fill="#ffffff">HNSW+PQ</tspan>
      <tspan fill="#94a3b8"> ∥ </tspan>
      <tspan fill="#ffffff">KG</tspan>
      <tspan fill="#94a3b8"> ] → </tspan>
      <tspan fill="#ffffff">fused rank</tspan>
      <tspan fill="#94a3b8"> → </tspan>
      <tspan fill="url(#accent)" font-weight="700">Ed25519-signed CRDT log</tspan>
      <tspan fill="#94a3b8"> → </tspan>
      <tspan fill="#ffffff" font-weight="700">.synx</tspan>
    </text>
  </g>

  <!-- metrics row -->
  <g transform="translate(80, 310)" font-family="JetBrains Mono, ui-monospace, monospace">
    <g>
      <text x="0" y="22" font-size="38" font-weight="800" fill="url(#rust)">23 µs</text>
      <text x="0" y="52" font-size="14" fill="#94a3b8" letter-spacing="1.5">BM25 QUERY</text>
    </g>
    <g transform="translate(220, 0)">
      <text x="0" y="22" font-size="38" font-weight="800" fill="url(#rust)">22 µs</text>
      <text x="0" y="52" font-size="14" fill="#94a3b8" letter-spacing="1.5">VECTOR kNN</text>
    </g>
    <g transform="translate(440, 0)">
      <text x="0" y="22" font-size="38" font-weight="800" fill="url(#rust)">0.69 ms</text>
      <text x="0" y="52" font-size="14" fill="#94a3b8" letter-spacing="1.5">COLD OPEN</text>
    </g>
    <g transform="translate(700, 0)">
      <text x="0" y="22" font-size="38" font-weight="800" fill="url(#accent)">1 file</text>
      <text x="0" y="52" font-size="14" fill="#94a3b8" letter-spacing="1.5">NO SERVERS</text>
    </g>
    <g transform="translate(910, 0)">
      <text x="0" y="22" font-size="38" font-weight="800" fill="url(#accent)">MIT + CC0</text>
      <text x="0" y="52" font-size="14" fill="#94a3b8" letter-spacing="1.5">RUST CORE</text>
    </g>
  </g>
</svg>
