<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-label="Synapse — one file. Your AI's entire memory.">
  <defs>
    <pattern id="gS" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
    </pattern>
    <radialGradient id="coreS" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff5722" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ff5722" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flowS" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff5722"/>
      <stop offset="100%" stop-color="#ffbf69"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect width="1600" height="720" fill="#0a0a0a"/>
  <rect width="1600" height="720" fill="url(#gS)"/>

  <!-- soft synaptic network, right 45% — Stripe/Linear quality, dimmed -->
  <g transform="translate(1180, 240)" opacity="0.85">
    <g stroke="#ff5722" stroke-width="1.2" fill="none" opacity="0.4">
      <line x1="0" y1="0" x2="-220" y2="-110"/>
      <line x1="0" y1="0" x2="-260" y2="10"/>
      <line x1="0" y1="0" x2="-200" y2="140"/>
      <line x1="0" y1="0" x2="150" y2="-170"/>
      <line x1="0" y1="0" x2="220" y2="-50"/>
      <line x1="0" y1="0" x2="240" y2="90"/>
      <line x1="0" y1="0" x2="160" y2="190"/>
      <line x1="0" y1="0" x2="-50" y2="210"/>
    </g>
    <g stroke="#ff5722" stroke-width="0.6" fill="none" opacity="0.18">
      <line x1="-220" y1="-110" x2="-260" y2="10"/>
      <line x1="-260" y1="10" x2="-200" y2="140"/>
      <line x1="150" y1="-170" x2="220" y2="-50"/>
      <line x1="220" y1="-50" x2="240" y2="90"/>
      <line x1="240" y1="90" x2="160" y2="190"/>
      <line x1="160" y1="190" x2="-50" y2="210"/>
    </g>
    <circle cx="0" cy="0" r="140" fill="url(#coreS)"/>
    <circle cx="0" cy="0" r="14" fill="#ff5722"/>
    <circle cx="0" cy="0" r="5" fill="#fafafa"/>
    <g fill="#fafafa">
      <circle cx="-220" cy="-110" r="4.5"/>
      <circle cx="-260" cy="10"   r="4.5"/>
      <circle cx="-200" cy="140"  r="4.5"/>
      <circle cx="150"  cy="-170" r="4.5"/>
      <circle cx="220"  cy="-50"  r="4.5"/>
      <circle cx="240"  cy="90"   r="4.5"/>
      <circle cx="160"  cy="190"  r="4.5"/>
      <circle cx="-50"  cy="210"  r="4.5"/>
    </g>
  </g>

  <!-- logo top-left -->
  <g transform="translate(80, 70)">
    <circle cx="28" cy="28" r="28" fill="#171717"/>
    <path d="M16 16 A 12 12 0 0 1 28 28" fill="none" stroke="#ff5722" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M40 40 A 12 12 0 0 1 28 28" fill="none" stroke="#ff5722" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="28" cy="28" r="2.5" fill="#fafafa"/>
    <text x="72" y="37" font-family="Inter, SF Pro Display, system-ui, sans-serif" font-size="22" font-weight="700" fill="#fafafa" letter-spacing="-0.4">Synapse</text>
  </g>

  <!-- headline block — Apple energy, giant type, outcome-first -->
  <g font-family="Inter, SF Pro Display, system-ui, sans-serif">
    <text x="80" y="220" font-size="120" font-weight="900" fill="#fafafa" letter-spacing="-4">Your AI</text>
    <text x="80" y="330" font-size="120" font-weight="900" fill="#ff5722" letter-spacing="-4">finally remembers.</text>
    <text x="80" y="392" font-size="26" font-weight="500" fill="#a3a3a3" letter-spacing="-0.3">
      One file. Everything. Forever.
    </text>
  </g>

  <!-- metric cards — Stripe style on dark -->
  <g font-family="JetBrains Mono, ui-monospace, monospace">
    <g transform="translate(80, 470)">
      <rect x="0" y="0" width="200" height="100" rx="14" fill="#141414" stroke="#262626"/>
      <text x="20" y="60" font-size="36" font-weight="800" fill="url(#flowS)">22 µs</text>
      <text x="20" y="84" font-size="11" font-weight="500" fill="#737373" letter-spacing="2">VECTOR SEARCH</text>
    </g>
    <g transform="translate(300, 470)">
      <rect x="0" y="0" width="200" height="100" rx="14" fill="#141414" stroke="#262626"/>
      <text x="20" y="60" font-size="36" font-weight="800" fill="url(#flowS)">23 µs</text>
      <text x="20" y="84" font-size="11" font-weight="500" fill="#737373" letter-spacing="2">FULL-TEXT SEARCH</text>
    </g>
    <g transform="translate(520, 470)">
      <rect x="0" y="0" width="200" height="100" rx="14" fill="#141414" stroke="#262626"/>
      <text x="20" y="60" font-size="36" font-weight="800" fill="url(#flowS)">0.69 ms</text>
      <text x="20" y="84" font-size="11" font-weight="500" fill="#737373" letter-spacing="2">COLD OPEN</text>
    </g>
    <g transform="translate(740, 470)">
      <rect x="0" y="0" width="200" height="100" rx="14" fill="#141414" stroke="#262626"/>
      <text x="20" y="60" font-size="36" font-weight="800" fill="#fafafa">1 file</text>
      <text x="20" y="84" font-size="11" font-weight="500" fill="#737373" letter-spacing="2">NO SERVERS</text>
    </g>
    <g transform="translate(960, 470)">
      <rect x="0" y="0" width="200" height="100" rx="14" fill="#141414" stroke="#262626"/>
      <text x="20" y="60" font-size="36" font-weight="800" fill="#fafafa">9 / 9</text>
      <text x="20" y="84" font-size="11" font-weight="500" fill="#737373" letter-spacing="2">CAPABILITIES</text>
    </g>
  </g>

  <!-- pipeline chip -->
  <g transform="translate(80, 614)">
    <rect x="0" y="0" width="1080" height="56" rx="28" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)"/>
    <text x="22" y="36" font-family="JetBrains Mono, ui-monospace, monospace" font-size="16" font-weight="500" fill="#e5e5e5">
      <tspan fill="url(#flowS)" font-weight="700">put</tspan>
      <tspan fill="#737373"> → </tspan>
      <tspan fill="#fafafa">search</tspan>
      <tspan fill="#737373"> → </tspan>
      <tspan fill="#fafafa">snap</tspan>
      <tspan fill="#525252"> · </tspan>
      <tspan fill="#fafafa">BM25 + vector + knowledge graph</tspan>
      <tspan fill="#525252"> · </tspan>
      <tspan fill="url(#flowS)" font-weight="700">Ed25519-signed</tspan>
      <tspan fill="#525252"> · </tspan>
      <tspan fill="#fafafa">CRDT sync</tspan>
      <tspan fill="#525252"> · </tspan>
      <tspan fill="#fafafa" font-weight="700">.synx</tspan>
    </text>
  </g>

  <g transform="translate(80, 700)" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#737373">
    <text x="0" y="0">Rust · MCP-native · MIT + CC0 · ships as one signed file · Built in Germany · Open forever</text>
  </g>
</svg>
