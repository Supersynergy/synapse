<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" role="img" aria-label="Synapse — minimal metric hero.">
  <defs>
    <pattern id="gA" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="640" fill="#0a0a0a"/>
  <rect width="1600" height="640" fill="url(#gA)"/>

  <!-- logo -->
  <g transform="translate(100, 110)">
    <circle cx="32" cy="32" r="32" fill="#171717"/>
    <path d="M18 18 A 14 14 0 0 1 32 32" fill="none" stroke="#ff5722" stroke-width="4" stroke-linecap="round"/>
    <path d="M46 46 A 14 14 0 0 1 32 32" fill="none" stroke="#ff5722" stroke-width="4" stroke-linecap="round"/>
    <circle cx="32" cy="32" r="3" fill="#fafafa"/>
  </g>

  <g font-family="Inter, SF Pro Display, system-ui, sans-serif">
    <text x="200" y="150" font-size="100" font-weight="800" fill="#fafafa" letter-spacing="-3.5">Synapse</text>
    <text x="200" y="200" font-size="30" font-weight="500" fill="#a3a3a3" letter-spacing="-0.6">One file. Your AI's entire memory.</text>
  </g>

  <g transform="translate(100, 340)" font-family="JetBrains Mono, ui-monospace, monospace">
    <text x="0" y="0" font-size="120" font-weight="800" fill="#ff5722" letter-spacing="-3">22 µs</text>
    <text x="0" y="40" font-size="16" font-weight="500" fill="#737373" letter-spacing="3">VECTOR kNN · k=10 · 2k × 64d</text>
  </g>

  <g transform="translate(760, 290)" font-family="JetBrains Mono, ui-monospace, monospace">
    <text x="0" y="0"   font-size="44" font-weight="700" fill="#fafafa">23 µs <tspan fill="#737373" font-weight="400" font-size="16">BM25 · Tantivy</tspan></text>
    <text x="0" y="56"  font-size="44" font-weight="700" fill="#fafafa">0.69 ms <tspan fill="#737373" font-weight="400" font-size="16">cold open · mmap</tspan></text>
    <text x="0" y="112" font-size="44" font-weight="700" fill="#fafafa">0.59 ms <tspan fill="#737373" font-weight="400" font-size="16">CRDT merge · Automerge</tspan></text>
    <text x="0" y="168" font-size="44" font-weight="700" fill="#fafafa">25 µs <tspan fill="#737373" font-weight="400" font-size="16">Ed25519 sign + verify</tspan></text>
  </g>

  <g transform="translate(100, 580)" font-family="Inter, SF Pro Display, system-ui, sans-serif" font-size="15" font-weight="500" fill="#737373">
    <text x="0" y="0">Rust · MCP-native · MIT + CC0 · one binary · one file · no servers</text>
  </g>
</svg>
