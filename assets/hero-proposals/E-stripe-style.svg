<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" role="img" aria-label="Synapse — Stripe-style hero.">
  <defs>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff5722"/>
      <stop offset="100%" stop-color="#ffbf69"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="640" fill="#fafafa"/>

  <!-- huge typography in off-white bg (Stripe/Linear energy) -->
  <g font-family="Inter, SF Pro Display, system-ui, sans-serif">
    <text x="100" y="180" font-size="104" font-weight="800" fill="#0a0a0a" letter-spacing="-3.5">Synapse</text>
    <text x="100" y="236" font-size="30" font-weight="500" fill="#525252" letter-spacing="-0.6">
      One file. Your AI's entire memory.
    </text>
    <text x="100" y="272" font-size="18" font-weight="500" fill="#737373" letter-spacing="-0.2">
      Kill Qdrant + Redis + your Python venv. One binary, one file, mmap'd.
    </text>
  </g>

  <!-- metric cards -->
  <g font-family="JetBrains Mono, ui-monospace, monospace">
    <g transform="translate(100, 360)">
      <rect x="0" y="0" width="220" height="120" rx="14" fill="#ffffff" stroke="#e5e5e5"/>
      <text x="24" y="70" font-size="40" font-weight="800" fill="url(#flow)">23 µs</text>
      <text x="24" y="96" font-size="13" font-weight="500" fill="#737373" letter-spacing="1.5">BM25 QUERY</text>
    </g>
    <g transform="translate(340, 360)">
      <rect x="0" y="0" width="220" height="120" rx="14" fill="#ffffff" stroke="#e5e5e5"/>
      <text x="24" y="70" font-size="40" font-weight="800" fill="url(#flow)">22 µs</text>
      <text x="24" y="96" font-size="13" font-weight="500" fill="#737373" letter-spacing="1.5">VECTOR kNN</text>
    </g>
    <g transform="translate(580, 360)">
      <rect x="0" y="0" width="220" height="120" rx="14" fill="#ffffff" stroke="#e5e5e5"/>
      <text x="24" y="70" font-size="40" font-weight="800" fill="url(#flow)">0.69 ms</text>
      <text x="24" y="96" font-size="13" font-weight="500" fill="#737373" letter-spacing="1.5">COLD OPEN</text>
    </g>
    <g transform="translate(820, 360)">
      <rect x="0" y="0" width="220" height="120" rx="14" fill="#ffffff" stroke="#e5e5e5"/>
      <text x="24" y="70" font-size="40" font-weight="800" fill="#0a0a0a">1 file</text>
      <text x="24" y="96" font-size="13" font-weight="500" fill="#737373" letter-spacing="1.5">NO SERVERS</text>
    </g>
    <g transform="translate(1060, 360)">
      <rect x="0" y="0" width="220" height="120" rx="14" fill="#ffffff" stroke="#e5e5e5"/>
      <text x="24" y="70" font-size="40" font-weight="800" fill="#0a0a0a">9 / 9</text>
      <text x="24" y="96" font-size="13" font-weight="500" fill="#737373" letter-spacing="1.5">CAPABILITIES</text>
    </g>
  </g>

  <!-- pipeline chip -->
  <g transform="translate(100, 540)">
    <rect x="0" y="0" width="1180" height="60" rx="30" fill="#0a0a0a"/>
    <text x="24" y="38" font-family="JetBrains Mono, ui-monospace, monospace" font-size="18" font-weight="500" fill="#e5e5e5">
      <tspan fill="url(#flow)" font-weight="700">put</tspan>
      <tspan fill="#737373"> → [ </tspan>
      <tspan fill="#fafafa">BM25</tspan>
      <tspan fill="#737373"> ∥ </tspan>
      <tspan fill="#fafafa">HNSW+PQ</tspan>
      <tspan fill="#737373"> ∥ </tspan>
      <tspan fill="#fafafa">KG</tspan>
      <tspan fill="#737373"> ] → </tspan>
      <tspan fill="#fafafa">fused rank</tspan>
      <tspan fill="#737373"> → </tspan>
      <tspan fill="url(#flow)" font-weight="700">Ed25519-signed CRDT log</tspan>
      <tspan fill="#737373"> → </tspan>
      <tspan fill="#fafafa" font-weight="700">.synx</tspan>
    </text>
  </g>

  <g transform="translate(100, 625)" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#737373">
    <text x="0" y="0">Rust · MCP-native · MIT + CC0 · Supersynergy · Built in Germany · Open forever</text>
  </g>
</svg>
