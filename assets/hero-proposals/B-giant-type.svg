<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" role="img" aria-label="Synapse — giant typographic hero.">
  <defs>
    <pattern id="gB" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="640" fill="#0a0a0a"/>
  <rect width="1600" height="640" fill="url(#gB)"/>

  <!-- massive "ONE FILE." poster-size -->
  <g font-family="Inter, SF Pro Display, system-ui, sans-serif">
    <text x="100" y="240" font-size="220" font-weight="900" fill="#fafafa" letter-spacing="-10">ONE FILE.</text>
    <text x="100" y="400" font-size="220" font-weight="900" fill="#ff5722" letter-spacing="-10">FULL BRAIN.</text>
  </g>

  <!-- footnote chip -->
  <g transform="translate(100, 510)" font-family="JetBrains Mono, ui-monospace, monospace">
    <rect x="-10" y="-32" width="960" height="56" rx="28" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)"/>
    <text x="10" y="5" font-size="18" font-weight="500" fill="#e5e5e5">
      <tspan fill="#ff5722" font-weight="700">Synapse v1.0</tspan>
      <tspan fill="#525252"> · </tspan>
      <tspan>23 µs BM25</tspan>
      <tspan fill="#525252"> · </tspan>
      <tspan>22 µs kNN</tspan>
      <tspan fill="#525252"> · </tspan>
      <tspan>0.69 ms cold open</tspan>
      <tspan fill="#525252"> · </tspan>
      <tspan>Rust · MIT + CC0</tspan>
    </text>
  </g>

  <g transform="translate(100, 595)" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#737373">
    <text x="0" y="0">One single-file format. One binary. No servers. Your AI's memory — signed, portable, forever.</text>
  </g>
</svg>
