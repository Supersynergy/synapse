<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" role="img" aria-label="Synapse — terminal mockup hero.">
  <rect width="1600" height="640" fill="#0a0a0a"/>

  <g font-family="Inter, SF Pro Display, system-ui, sans-serif">
    <text x="100" y="110" font-size="72" font-weight="800" fill="#fafafa" letter-spacing="-2.5">Synapse</text>
    <text x="100" y="148" font-size="22" font-weight="500" fill="#a3a3a3">One file. Your AI's entire memory.</text>
  </g>

  <!-- terminal window -->
  <g transform="translate(100, 210)">
    <rect x="0" y="0" width="1400" height="360" rx="14" fill="#0f0f0f" stroke="#262626" stroke-width="1"/>
    <!-- title bar -->
    <rect x="0" y="0" width="1400" height="36" rx="14" fill="#1a1a1a"/>
    <rect x="0" y="18" width="1400" height="18" fill="#1a1a1a"/>
    <circle cx="22" cy="18" r="6" fill="#ff5f56"/>
    <circle cx="44" cy="18" r="6" fill="#ffbd2e"/>
    <circle cx="66" cy="18" r="6" fill="#27c93f"/>
    <text x="700" y="24" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" fill="#737373" text-anchor="middle">bash — synapse</text>

    <!-- terminal content -->
    <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="16">
      <text x="24" y="80"  fill="#737373">$</text>
      <text x="44" y="80"  fill="#fafafa">synapse put "we chose Rust because single-binary shipping matters"</text>
      <text x="24" y="108" fill="#27c93f">✓</text>
      <text x="44" y="108" fill="#a3a3a3">stored · BLAKE3 a7c9e4… · scope=project/supersynergy · 67 µs</text>

      <text x="24" y="148" fill="#737373">$</text>
      <text x="44" y="148" fill="#fafafa">synapse search "why Rust?" --mode hybrid</text>
      <text x="44" y="176" fill="#a3a3a3">1. we chose Rust because single-binary shipping matters</text>
      <text x="44" y="198" fill="#525252">   score 0.94 · BM25 + vec · 23 µs total</text>

      <text x="24" y="238" fill="#737373">$</text>
      <text x="44" y="238" fill="#fafafa">synapse snap ~/brain.brainpack --sign</text>
      <text x="24" y="266" fill="#27c93f">✓</text>
      <text x="44" y="266" fill="#a3a3a3">signed · Ed25519 · 1 204 memories · 342 KB</text>

      <text x="24" y="306" fill="#737373">$</text>
      <text x="44" y="306" fill="#ff5722">scp ~/brain.brainpack friend@laptop:/tmp/ &amp;&amp; synapse verify /tmp/brain.brainpack</text>
      <text x="24" y="334" fill="#27c93f">✓</text>
      <text x="44" y="334" fill="#a3a3a3">valid · author did:key:z6Mk… · 1 204 memories restored</text>
    </g>
  </g>

  <!-- footer strip -->
  <g transform="translate(100, 605)" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#737373">
    <text x="0" y="0">Rust · MCP-native · MIT + CC0 · `cargo install --git … --tag v1.0.0 synapse-cli`</text>
  </g>
</svg>
