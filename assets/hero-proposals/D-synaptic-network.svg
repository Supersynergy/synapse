<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" role="img" aria-label="Synapse — synaptic network hero.">
  <defs>
    <radialGradient id="coreD" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff5722" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ff5722" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="640" fill="#0a0a0a"/>

  <!-- animated-feel network (static SVG approximation) on the right 60% -->
  <g transform="translate(760, 320)" opacity="0.92">
    <!-- connection lines, hand-placed -->
    <g stroke="#ff5722" stroke-width="1.4" fill="none" opacity="0.55">
      <line x1="0" y1="0" x2="-260" y2="-140"/>
      <line x1="0" y1="0" x2="-320" y2="0"/>
      <line x1="0" y1="0" x2="-240" y2="160"/>
      <line x1="0" y1="0" x2="180" y2="-200"/>
      <line x1="0" y1="0" x2="260" y2="-60"/>
      <line x1="0" y1="0" x2="300" y2="100"/>
      <line x1="0" y1="0" x2="200" y2="220"/>
      <line x1="0" y1="0" x2="-60" y2="240"/>
    </g>
    <g stroke="#ff5722" stroke-width="0.8" fill="none" opacity="0.3">
      <line x1="-260" y1="-140" x2="-320" y2="0"/>
      <line x1="-320" y1="0" x2="-240" y2="160"/>
      <line x1="180" y1="-200" x2="260" y2="-60"/>
      <line x1="260" y1="-60" x2="300" y2="100"/>
      <line x1="300" y1="100" x2="200" y2="220"/>
      <line x1="200" y1="220" x2="-60" y2="240"/>
      <line x1="-60" y1="240" x2="-240" y2="160"/>
    </g>
    <!-- core node -->
    <circle cx="0" cy="0" r="160" fill="url(#coreD)"/>
    <circle cx="0" cy="0" r="16" fill="#ff5722"/>
    <circle cx="0" cy="0" r="6" fill="#fafafa"/>
    <!-- leaf nodes -->
    <g fill="#fafafa">
      <circle cx="-260" cy="-140" r="5"/>
      <circle cx="-320" cy="0"    r="5"/>
      <circle cx="-240" cy="160"  r="5"/>
      <circle cx="180"  cy="-200" r="5"/>
      <circle cx="260"  cy="-60"  r="5"/>
      <circle cx="300"  cy="100"  r="5"/>
      <circle cx="200"  cy="220"  r="5"/>
      <circle cx="-60"  cy="240"  r="5"/>
    </g>
  </g>

  <!-- title block left -->
  <g font-family="Inter, SF Pro Display, system-ui, sans-serif">
    <text x="100" y="160" font-size="110" font-weight="800" fill="#fafafa" letter-spacing="-3.5">Synapse</text>
    <text x="100" y="210" font-size="26" font-weight="500" fill="#a3a3a3">One file. Your AI's entire memory.</text>
  </g>

  <g transform="translate(100, 360)" font-family="JetBrains Mono, ui-monospace, monospace">
    <text x="0" y="0" font-size="60" font-weight="800" fill="#ff5722" letter-spacing="-2">
      23 µs BM25 <tspan fill="#737373">·</tspan> 22 µs kNN
    </text>
    <text x="0" y="46" font-size="60" font-weight="800" fill="#fafafa" letter-spacing="-2">
      0.69 ms cold open
    </text>
    <text x="0" y="88" font-size="16" font-weight="500" fill="#737373" letter-spacing="2.5">
      TANTIVY · HNSW+PQ · KG · AUTOMERGE CRDT · Ed25519
    </text>
  </g>

  <g transform="translate(100, 595)" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#737373">
    <text x="0" y="0">Rust core · MIT + CC0 · MCP-native · one binary, one file, no servers</text>
  </g>
</svg>
